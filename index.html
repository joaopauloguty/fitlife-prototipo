<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitLife – Protótipo das interfaces</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#f3f5f2;--surf:#fff;--ink:#14202b;--mut:#5b6773;--line:#d9dfe3;--pri:#0b6e6e;--pri-ink:#fff;--side:#12232e;--side-ink:#dbe6ec;--mark:#f2b705;--bad:#c93a3a;--ok:#1f7a4d;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--surf:#16232c;--ink:#e8eef2;--mut:#9aa8b3;--line:#2a3a46;--pri:#35b3b3;--pri-ink:#06222a;--side:#0a1217;--side-ink:#c5d3dc;--bad:#ef6a6a;--ok:#53c08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171d;--surf:#16232c;--ink:#e8eef2;--mut:#9aa8b3;--line:#2a3a46;--pri:#35b3b3;--pri-ink:#06222a;--side:#0a1217;--side-ink:#c5d3dc;--bad:#ef6a6a;--ok:#53c08a;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;margin:0;letter-spacing:.2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.hero h1{font-size:clamp(48px,7vw,92px);line-height:.95;color:#fff}
.hero p{max-width:34ch;margin:0;font-size:18px}
.bar{width:64px;height:8px;background:var(--mark);margin-bottom:8px}
.logincard{display:flex;align-items:center;justify-content:center;padding:32px}
.logincard form{width:100%;max-width:360px;display:grid;gap:14px}
.logincard h2{font-size:34px}
#app{display:none;min-height:100vh;grid-template-columns:260px 1fr}
aside{background:var(--side);color:var(--side-ink);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:700 28px "Barlow Condensed",sans-serif;color:#fff;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:22px;background:var(--mark);display:inline-block}
.grp{font-size:13px;font-weight:600;color:#8ea2b0;padding:14px 10px 6px}
aside a{display:block;padding:8px 10px;border-radius:6px;color:inherit;text-decoration:none;border-left:3px solid transparent}
aside a:hover{background:rgba(255,255,255,.07)}
aside a.on{background:rgba(255,255,255,.1);border-left-color:var(--mark);color:#fff;font-weight:600}
.who{margin-top:18px;padding:10px;border-top:1px solid #2a3b47;font-size:14px}
.who button{margin-top:8px}
main{padding:28px;min-width:0}
.top{display:none;align-items:center;gap:10px;margin-bottom:12px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:980px}
.panel h2{font-size:32px;margin-bottom:2px}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:14px;font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;font-weight:400}
.sec{grid-column:1/-1;font:700 20px "Barlow Condensed",sans-serif;border-bottom:1px solid var(--line);padding-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--surf);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.d{color:var(--bad);border-color:var(--bad)}
.tw{overflow-x:auto;margin-top:22px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600}
.tw h3{font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
.toast.show{opacity:1}
.menu{display:none}
@media(max-width:820px){
#login{grid-template-columns:1fr}.hero{min-height:36vh;padding:28px}
#app{grid-template-columns:1fr}
aside{position:fixed;inset:0 auto 0 0;width:260px;height:100%;z-index:10;transform:translateX(-105%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
aside.open{transform:none}
.top{display:flex}.menu{display:inline-block}
main{padding:16px}.grid{grid-template-columns:1fr}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="login">
  <div class="hero"><div class="bar"></div><h1>FitLife</h1><p>Treinos, matrículas e hidratação da academia em um só lugar.</p></div>
  <div class="logincard">
    <form id="lf">
      <h2>Entrar no sistema</h2>
      <label>E-mail<input type="email" value="joao@fitlife.com" required></label>
      <label>Senha<input type="password" value="123456" required></label>
      <label>Entrar como<select id="perfil"><option value="f">Funcionário (instrutor/administrador)</option><option value="a">Aluno</option></select></label>
      <button class="btn p" type="submit">Entrar</button>
      <small style="color:var(--mut)">Protótipo de interface: os dados são fictícios e nada é salvo.</small>
    </form>
  </div>
</section>
<div id="app">
  <aside id="side"><div class="brand"><i></i>FitLife</div><nav id="nav"></nav>
    <div class="who"><span id="who"></span><br><button class="btn" id="out">Sair</button> <button class="btn" id="tm">Tema</button></div></aside>
  <main>
    <div class="top"><button class="btn menu" id="mb" aria-label="Abrir menu">☰ Menu</button><strong>FitLife</strong></div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
var S=[
["Cadastros","usuarios","Cadastro de usuários","Dados de acesso de funcionários e alunos.",[["Nome"],["E-mail","email"],["Senha","password"],["Tipo de usuário","s","Funcionário|Aluno"]],[["Ana Souza","ana@fitlife.com","••••••","Funcionário"],["Carlos Lima","carlos@email.com","••••••","Aluno"]]],
["Cadastros","alunos","Cadastro de alunos","Dados físicos e objetivo do aluno.",[["Usuário","s","Carlos Lima|Marina Reis"],["Data de nascimento","date"],["Sexo","s","Masculino|Feminino"],["Peso (kg)","number"],["Altura (cm)","number"],["Objetivo","s","Emagrecimento|Ganho de massa|Condicionamento"]],[["Carlos Lima","12/03/1998","Masculino","78","178","Ganho de massa"],["Marina Reis","27/08/2001","Feminino","64","165","Emagrecimento"]]],
["Cadastros","funcionarios","Cadastro de funcionários","Instrutores e administradores da academia.",[["Usuário","s","Ana Souza|Pedro Alves"],["Data de nascimento","date"],["CPF"],["RG"]],[["Ana Souza","04/05/1990","000.000.000-00","0.000.000-0"],["Pedro Alves","19/11/1985","111.111.111-11","1.111.111-1"]]],
["Cadastros","planos","Cadastro de planos","Planos oferecidos aos alunos.",[["Nome"],["Duração (meses)","number"],["Valor mensal (R$)","number"]],[["Mensal","1","R$ 99,00"],["Trimestral","3","R$ 89,00"]]],
["Cadastros","modalidades","Cadastro de modalidades","Modalidades disponíveis na academia.",[["Nome"],["Descrição","t"]],[["Musculação","Treino com carga e aparelhos"],["Cardio","Esteira, bicicleta e elíptico"]]],
["Cadastros","exercicios","Cadastro de exercícios","Exercícios usados nas fichas de treino.",[["Nome"],["Equipamento utilizado"]],[["Supino reto","Barra e banco"],["Esteira","Esteira elétrica"]]],
["Movimentações","agua","Controle de água","Registre a água consumida ao longo do dia.",[["Aluno","s","Carlos Lima|Marina Reis"],["Data","date"],["Quantidade consumida (ml)","number"]],[["Carlos Lima","25/11/2026","500 ml"],["Carlos Lima","25/11/2026","750 ml"]],1],
["Movimentações","cardio","Controle de cardio","Atividades cardiovasculares da ficha de treino.",[["Aluno","s","Carlos Lima|Marina Reis"],["Exercício","s","Esteira|Bicicleta|Elíptico"],["Tempo (min)","number"],["Gasto calórico (kcal)","number"]],[["Carlos Lima","Esteira","30 min","280 kcal"],["Marina Reis","Bicicleta","45 min","350 kcal"]],1],
["Movimentações","matricula","Controle de matrícula","O vencimento é calculado pela duração do plano.",[["Aluno","s","Carlos Lima|Marina Reis"],["Plano","s","Mensal|Trimestral"],["Modalidade","s","Musculação|Cardio"],["Data da matrícula","date"],["Data de vencimento (automática)","date"],["Status","s","Ativa|Inativa"]],[["Carlos Lima","Mensal","Musculação","05/11/2026","05/12/2026","Ativa"],["Marina Reis","Trimestral","Cardio","10/10/2026","10/01/2027","Ativa"]]],
["Movimentações","recebimento","Controle de recebimento","Pagamento das mensalidades.",[["Matrícula","s","Carlos Lima – Mensal|Marina Reis – Trimestral"],["Mês de referência"],["Valor recebido (R$)","number"],["Data do recebimento","date"],["Forma de recebimento","s","Dinheiro|Pix|Cartão"]],[["Carlos Lima – Mensal","Novembro","R$ 99,00","05/11/2026","Pix"],["Marina Reis – Trimestral","Novembro","R$ 89,00","10/11/2026","Cartão"]]],
["Movimentações","ficha","Controle de ficha de treino","Monte a ficha do aluno e inclua os itens.",[["h","Ficha"],["Aluno","s","Carlos Lima|Marina Reis"],["Instrutor","s","Ana Souza|Pedro Alves"],["Data inicial","date"],["h","Itens da ficha"],["Exercício","s","Supino reto|Agachamento|Remada"],["Séries"],["Repetições","number"],["Carga (kg)"],["Descanso (s)","number"]],[["Carlos Lima","Ana Souza","16/11/2026","Supino reto","4","10","40","60"],["Carlos Lima","Ana Souza","16/11/2026","Agachamento","4","12","60","90"]],1],
["Relatórios","r1","Relatório de evolução física","Escolha o aluno e o período.",[["Aluno","s","Carlos Lima|Marina Reis"],["Data inicial","date"],["Data final","date"]],null,1],
["Relatórios","r2","Relatório de treinos","Escolha aluno, instrutor e período.",[["Aluno","s","Todos|Carlos Lima|Marina Reis"],["Instrutor","s","Todos|Ana Souza|Pedro Alves"],["Data inicial","date"],["Data final","date"]],null,1],
["Relatórios","r3","Relatório de atividade de cardio","Escolha o aluno e o período.",[["Aluno","s","Carlos Lima|Marina Reis"],["Data inicial","date"],["Data final","date"]],null,1],
["Relatórios","r4","Relatório de consumo de água","Escolha o aluno e o período.",[["Aluno","s","Carlos Lima|Marina Reis"],["Data inicial","date"],["Data final","date"]],null,1]
];
var $=function(i){return document.getElementById(i)},perfil="f";
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},2200)}
function field(f){
 if(f[0]==="h")return '<div class="sec">'+f[1]+'</div>';
 var t=f[1]||"text",l=f[0],c="",x=t==="t"?" full":"";
 if(t==="s"){if(perfil==="a"&&l==="Aluno")c="<select disabled><option>Carlos Lima</option></select>";else c="<select>"+f[2].split("|").map(function(o){return"<option>"+o+"</option>"}).join("")+"</select>"}
 else if(t==="t")c='<input type="text">';else c='<input type="'+t+'">';
 return"<label class='"+x+"'>"+l+c+"</label>";
}
function nav(cur){
 var g="",h="";
 S.forEach(function(s){
  if(perfil==="a"&&!s[6])return;
  if(s[0]!==g){g=s[0];h+='<div class="grp">'+g+"</div>"}
  h+='<a href="#'+s[1]+'" class="'+(s[1]===cur?"on":"")+'">'+s[2].replace(/^(Cadastro de |Controle de )/,function(m){return""}).replace(/^./,function(c){return c.toUpperCase()})+"</a>";
 });
 $("nav").innerHTML=h;
}
function show(){
 var id=location.hash.slice(1),s=S.filter(function(x){return x[1]===id&&(perfil==="f"||x[6])})[0];
 if(!$("app").style.display||$("app").style.display==="none"){return}
 if(!s)s=S.filter(function(x){return perfil==="f"||x[6]})[0];
 nav(s[1]);$("side").classList.remove("open");
 var rel=s[0]==="Relatórios",h='<div class="panel"><h2>'+s[2]+'</h2><p class="sub">'+s[3]+(perfil==="a"?" Você vê apenas os seus próprios dados.":"")+'</p><div class="grid">'+s[4].map(field).join("")+"</div>";
 h+='<div class="btns">'+(rel?'<button class="btn p" data-m="Relatório emitido (simulação)">Emitir relatório</button><button class="btn" data-m="Filtros limpos">Limpar filtros</button>':
  (perfil==="f"?'<button class="btn p" data-m="Registro cadastrado">Cadastrar</button><button class="btn p" data-m="Registro salvo">Salvar</button><button class="btn" data-m="Registro alterado">Alterar</button><button class="btn" data-m="Edição cancelada">Cancelar</button><button class="btn d" data-m="Exclusão bloqueada se houver vínculos (Regra 15)">Excluir</button><button class="btn" data-m="Pesquisa realizada">Pesquisar</button>':
  '<button class="btn p" data-m="Registro salvo">Salvar</button><button class="btn" data-m="Edição cancelada">Cancelar</button><button class="btn" data-m="Pesquisa realizada">Pesquisar</button>'))+"</div>";
 if(s[5]){var cols=s[4].filter(function(f){return f[0]!=="h"});
  h+='<div class="tw"><h3>Registros</h3><table><tr>'+cols.map(function(c){return"<th>"+c[0].replace(/ \(.*\)/,"")+"</th>"}).join("")+"</tr>"+(perfil==="a"?s[5].filter(function(r){return r[0]==="Carlos Lima"}):s[5]).map(function(r){return"<tr>"+r.map(function(c){return"<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</table></div>"}
 if(rel)h+='<div class="tw"><h3>Pré-visualização do relatório</h3><table><tr><th>Aluno</th><th>Data</th><th>Valor</th></tr><tr><td>xxxxxxxx</td><td>dd/mm/aaaa</td><td>xxxx</td></tr><tr><td>xxxxxxxx</td><td>dd/mm/aaaa</td><td>xxxx</td></tr></table></div>';
 $("view").innerHTML=h+"</div>";window.scrollTo(0,0);
}
function enter(){$("login").style.display="none";$("app").style.display="grid";
 $("who").textContent=perfil==="f"?"Perfil: funcionário":"Perfil: aluno – Carlos Lima";show()}
$("lf").addEventListener("submit",function(e){e.preventDefault();perfil=$("perfil").value;location.hash="";enter();toast("Login realizado")});
$("out").onclick=function(){$("app").style.display="none";$("login").style.display="grid";location.hash=""};
$("mb").onclick=function(){$("side").classList.toggle("open")};
$("tm").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
$("view").addEventListener("click",function(e){var m=e.target.getAttribute&&e.target.getAttribute("data-m");if(m)toast(m)});
window.addEventListener("hashchange",show);
</script>
</body>
</html>
